# Cloudflare Workers 設定（uaip → https://uaip.cc.cd）。v2.0.0 Phase D 起從 Pages 遷來。
# 部署：npx wrangler deploy　｜　本機：npx wrangler dev
#（Phase F 目錄重整後 Pages 版設定已退役 — functions/ 不存在了，回滾單位是 git commit。）
name = "uaip"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# 正式網域（2026-07-16 已從 Pages 割接到本 Worker，同 zone）。
# 這段讓 `wrangler deploy` 維持綁定。回滾＝拿掉這段、把網域加回 Pages 專案。
routes = [
  { pattern = "uaip.cc.cd", custom_domain = true }
]

# 靜態資產：public/ 由邊緣供應，Worker 透過 env.ASSETS.fetch 存取。
# not_found_handling=single-page-application → ASSETS.fetch 對找不到的路徑回 index.html
#（前端路由 /ip /ua 靠這個）。但這個模式下「每條路徑都算命中 index.html」，所以必須
# run_worker_first=true 讓 Worker 先接管全部路由，否則 /api/* /news 這些會被直接吐成 index.html
#（Phase D spike 實測：run_worker_first=["/"] 時 /api/health 回的是 SPA 殼）。
# Worker 找不到路由才 fetch ASSETS（真實靜態檔照回、其餘 SPA fallback）。_headers 仍生效
# （wrangler dev 實測 "Parsed 2 valid header rules"）。個人站流量遠低於 10 萬 req/日免費額度。
[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# 站台正式網址（canonical、og、sitemap、RSS、CSRF 白名單）。
# fork 的人改成自己的網域即可；沒設定時程式退回用「請求本身的 origin」。
[vars]
SITE_ORIGIN = "https://uaip.cc.cd"

# D1 資料庫綁定：handler 裡用 env.DB 存取。
# database_id 不是秘密（存取要過 Cloudflare 帳號權限）；fork 的人換成自己
# `wrangler d1 create` 出來的 id，database_name 也一併改。
[[d1_databases]]
binding = "DB"
database_name = "ipua-logs"
database_id = "75e2b765-66fd-4946-99c4-4524b4149ce0"

# 限流器 Durable Object（v2.0.0 Phase H，ADR-0007）：每個會員一顆實例（idFromName "u:<id>"），
# SQLite-backed 原子計數，修掉 D1 COUNT 的並發競態。settings 設 quota_do='0' 可免部署退回 D1 路徑。
[durable_objects]
bindings = [{ name = "RATE_LIMITER", class_name = "RateLimiter" }]

# DO 類別首次上線要宣告成 SQLite-backed（免費層也只支援這種）；migrations tag 一經部署不可改
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# cron 排程（v2.0.0 Phase I，src/cron.ts）：每 5 分鐘掃 errlog 推 Telegram 告警（secrets
# TG_BOT_TOKEN／TG_CHAT_ID 未設＝跳過）；每日 UTC 19:17（台北 03:17 低峰）聚合＋備份＋清理。
[triggers]
crons = ["*/5 * * * *", "17 19 * * *"]

# ── R2 儲存（2026-07-29 帳號開通後啟用；在此之前整站是純 D1）──────────────────
#
# 這兩個綁定都是**可選的**：拿掉就退回純 D1 模式，程式照跑、不必改任何一行程式碼。
#   BACKUPS 沒綁 → 每日備份 job 跳過（cron_last_backup 記 skip），其他 cron 照跑。
#   FILES   沒綁 → Playground 附件寫進 D1 的 b64 欄位，單檔上限跟著縮回 1400KB。
# 兩種模式的完整說明在 docs/adr/0013-r2-optional-attachments.md 與 README「儲存模式」。

# 備份桶：每日全庫 JSONL（media 的 BLOB 排除）、保留 14 份。
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "uaip-backups"

# 附件桶：Playground 的圖片附件（存 base64 字串，不是二進位 —— 理由見 lib/filestore.ts）。
# 綁定在＝新附件寫 R2、單檔放寬到 5MB；每一列自己記存在哪（pg_files.storage），
# 所以切換模式不必搬資料，舊檔照樣讀得到。
# ⚠ 免費額度（10GB 儲存／Class A 100 萬／Class B 1000 萬 每月）的守門在 lib/r2budget.ts，
# 上限是程式寫死的天花板，管理員在 /settings 只能往下調、不能往上突破。
[[r2_buckets]]
binding = "FILES"
bucket_name = "uaip-files"

# 本機 wrangler dev 用 localhost 當 request.url 的 host（不設的話會拿 routes 的正式網域，
# localhost 免金鑰／dev 登入表單全會失效）。只影響本機，不影響部署。
[dev]
host = "localhost"
